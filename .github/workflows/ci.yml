# Verifies every push and pull request (deploy.md 6): lint with the module
# boundary check, types, schema, unit tests, and integration tests on a
# disposable PostgreSQL. Building images and deploying come with the release
# pipeline, not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Only used to create and drop a database per integration suite; the
      # database named here is never written to.
      postgres:
        image: postgres:18.2-alpine
        env:
          POSTGRES_USER: merchant
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: merchant_operations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchant -d merchant_operations"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://merchant:ci-only-not-a-secret@localhost:5432/merchant_operations?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Lint (ESLint, color guard, module boundaries)
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:validate
      - run: pnpm format:check
      - name: Unit, contract, and isolation tests
        run: pnpm test
      - name: Integration tests on a disposable PostgreSQL
        run: pnpm --filter @merchant/api test:integration
